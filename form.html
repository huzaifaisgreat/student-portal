{% extends "base.html" %}
{% block title %}{{ 'Edit' if editing else 'Add' }} student · Student Portal{% endblock %}
{% block content %}
<h1>{{ 'Edit student' if editing else 'Add student' }}</h1>
<form method="post" class="card form">
  <label>Roll number
    <input name="roll_no" value="{{ record.get('roll_no', '') }}" placeholder="e.g. 25L-5308"
           {{ 'readonly' if editing }} required>
  </label>
  <label>Full name
    <input name="name" value="{{ record.get('name', '') }}" required>
  </label>
  <label>Department
    <select name="department" required>
      <option value="">Select…</option>
      {% for d in departments %}
      <option {{ 'selected' if record.get('department') == d }}>{{ d }}</option>
      {% endfor %}
    </select>
  </label>
  <div class="two-col">
    <label>Semester (1–8)
      <input name="semester" type="number" min="1" max="8" value="{{ record.get('semester', '') }}" required>
    </label>
    <label>Marks (0–100)
      <input name="marks" type="number" step="0.1" min="0" max="100" value="{{ record.get('marks', '') }}" required>
    </label>
  </div>
  <div class="actions">
    <button class="btn primary" type="submit">{{ 'Save changes' if editing else 'Add student' }}</button>
    <a class="btn" href="{{ url_for('students') }}">Cancel</a>
  </div>
</form>
{% endblock %}
