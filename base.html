<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.user %}
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">Student Portal</a>
    <nav>
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('students') }}">Students</a>
      <a href="{{ url_for('report') }}">Report</a>
    </nav>
    <div class="user">{{ session.user }} · <a href="{{ url_for('logout') }}">Log out</a></div>
  </header>
  {% endif %}
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
